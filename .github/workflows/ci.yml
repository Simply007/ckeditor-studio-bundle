name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Validate composer.json
        run: composer validate --no-check-lock --no-check-publish
      - name: Lint PHP
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assets/studio/package-lock.json
      - run: npm ci
      - run: npm run check-types
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-build
          path: public/studio/build/
